name: Shelfwise pipeline

# Every push to main builds, scans and publishes. Pull requests run the same quality
# gates without publishing anything.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  # Superseded pull-request runs are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ------------------------------------------------------------------ quality gates
  backend:
    name: Backend · lint and test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint and format check (ruff, including bandit security rules)
        run: |
          ruff check . ../activity --output-format=github
          ruff format --check . ../activity

      - name: Run tests (any failure stops the pipeline before images are built)
        run: pytest -v --cov=app --cov-report=term --cov-report=xml --cov-fail-under=90

      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend · build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Version string (matches the short image tag, e.g. sha-1a2b3c4)
        run: echo "APP_VERSION=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Production build
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist

  helm:
    name: Helm · lint and validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz             | sudo tar -xz -C /usr/local/bin kubeconform
      - name: Lint the chart with each environment's values
        run: |
          helm lint helm/shelfwise --strict -f helm/shelfwise/values-local.yaml
          helm lint helm/shelfwise --strict -f helm/shelfwise/values-eks.yaml --set image.tag=sha-ci
          helm lint helm/shelfwise --strict -f helm/shelfwise/values-staging.yaml --set image.tag=sha-ci
      - name: Render and validate against the Kubernetes 1.35 API schemas
        run: |
          for env in local staging eks; do
            helm template shelfwise helm/shelfwise -n shelfwise               -f helm/shelfwise/values-$env.yaml --set image.tag=sha-ci               --api-versions monitoring.coreos.com/v1
          done | kubeconform -strict -summary -kubernetes-version 1.35.0             -schema-location default             -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  terraform:
    name: Terraform · fmt and validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: Formatting
        run: terraform fmt -check -recursive
      # No backend and no AWS credentials: this checks the code and never touches AWS.
      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

  secrets:
    name: Secret scan · gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every commit, not just the latest: a deleted secret is still leaked

      - name: Scan the full Git history for credentials
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1             git /repo --redact --verbose --exit-code 1

  # ------------------------------------------------------------------ build, scan, publish
  images:
    name: Image · ${{ matrix.component }}
    needs: [backend, frontend, secrets]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry
      security-events: write # upload Trivy findings to the Security tab
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, activity]
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - name: Version string (matches the short image tag, e.g. sha-1a2b3c4)
        run: echo "APP_VERSION=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Work out the image name (GHCR needs a lowercase owner)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shelfwise-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Tag with the commit SHA, never "latest"
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=sha,prefix=,format=long

      - name: Build the image for scanning
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          load: true
          tags: scan/shelfwise-${{ matrix.component }}:${{ github.sha }}
          build-args: APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Trivy gate (fail on any HIGH or CRITICAL vulnerability)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan/shelfwise-${{ matrix.component }}:${{ github.sha }}
          scanners: vuln,secret
          vuln-type: os,library
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"

      - name: Trivy report for GitHub code scanning (all severities from MEDIUM up)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan/shelfwise-${{ matrix.component }}:${{ github.sha }}
          severity: MEDIUM,HIGH,CRITICAL
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          exit-code: "0"
          skip-setup-trivy: true

      - name: Upload findings to the Security tab
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.component)) != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}

      # Only reached when the gate passed: what gets pushed is exactly what was scanned,
      # rebuilt from the same layer cache.
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha,scope=${{ matrix.component }}
          provenance: mode=max
          sbom: true

      - name: Summary
        if: env.PUBLISH == 'true'
        run: |
          {
            echo "### ${{ matrix.component }} image published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
