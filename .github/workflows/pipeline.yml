name: Shelfwise pipeline

# Every push to main builds, scans and publishes. Pull requests run the same quality
# gates without publishing anything.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  # Superseded pull-request runs are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ------------------------------------------------------------------ quality gates
  backend:
    name: Backend · lint and test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint and format check (ruff, including bandit security rules)
        run: |
          ruff check . --output-format=github
          ruff format --check .

      - name: Run tests (any failure stops the pipeline before images are built)
        run: pytest -v --cov=app --cov-report=term --cov-report=xml --cov-fail-under=90

      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend · build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Production build
        run: npm run build
        env:
          VITE_APP_VERSION: sha-${{ github.sha }}

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
