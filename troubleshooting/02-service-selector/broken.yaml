# Scenario 2: the pods are healthy but nothing reaches them.
# Symptom: requests to the Service hang or are refused, `kubectl get endpointslices`
# shows no addresses. The Service's selector does not match the pods' labels.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-web
  namespace: shelfwise-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: library-web
  template:
    metadata:
      labels:
        app: library-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:stable-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: http }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: library-web
  namespace: shelfwise-lab
spec:
  selector:
    app: libary-web # BUG: typo, so this selects no pods
  ports:
    - name: http
      port: 80
      targetPort: http
