# A burst of traffic to make the backend HorizontalPodAutoscaler scale out.
#
#   kubectl apply -f scripts/load-test.yaml
#   kubectl get hpa -n shelfwise -w          # watch replicas climb from 2
#   kubectl delete -f scripts/load-test.yaml # when done; the HPA scales back down
#
# k6 ramps to 60 virtual users hitting the heavier read endpoints (catalogue with
# availability, stats, overdue loans) for about four minutes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shelfwise-load-test
  namespace: shelfwise
data:
  load.js: |
    import http from "k6/http";
    import { check, sleep } from "k6";

    const API = "http://shelfwise-backend:8000/api";

    export const options = {
      stages: [
        { duration: "30s", target: 20 },
        { duration: "3m", target: 60 },
        { duration: "30s", target: 0 },
      ],
      thresholds: {
        http_req_failed: ["rate<0.01"],
        http_req_duration: ["p(95)<2000"],
      },
    };

    export default function () {
      const responses = http.batch([
        ["GET", `${API}/books`],
        ["GET", `${API}/stats`],
        ["GET", `${API}/loans?state=overdue`],
      ]);
      responses.forEach((r) => check(r, { "status 200": (res) => res.status === 200 }));
      sleep(0.2);
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: shelfwise-load-test
  namespace: shelfwise
  labels:
    app.kubernetes.io/name: load-test
    app.kubernetes.io/part-of: shelfwise
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: load-test
        app.kubernetes.io/instance: shelfwise # allowed through the backend NetworkPolicy
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k6
          image: grafana/k6:1.3.0
          args: ["run", "--quiet", "/scripts/load.js"]
          resources:
            requests: { cpu: 200m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: shelfwise-load-test
