# kube-prometheus-stack (chart prometheus-community/kube-prometheus-stack 92.7.0),
# sized for a single-node minikube with a few GB to spare.
#
#   helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#     --version 92.7.0 -n monitoring --create-namespace \
#     -f monitoring/kube-prometheus-stack.values.yaml
#
# Shelfwise brings its own ServiceMonitor, PrometheusRule and dashboard (Helm chart,
# monitoring.enabled=true). Prometheus below is told to pick those up from any namespace.

prometheus:
  prometheusSpec:
    # Select every ServiceMonitor / PodMonitor / PrometheusRule in the cluster, not just
    # ones labelled for this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 2d
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { memory: 1Gi }
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: [prometheus.shelfwise.local]

grafana:
  # The admin password is generated by the chart and stored in the
  # monitoring-grafana Secret (see docs/DEMO.md for how to read it).
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: [grafana.shelfwise.local]
  grafana.ini:
    # Read-only viewing without a login, handy for a demo screen. Editing still
    # requires the admin account.
    auth.anonymous:
      enabled: true
      org_role: Viewer
    dashboards:
      default_home_dashboard_path: /tmp/dashboards/shelfwise.json
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  resources:
    requests: { cpu: 50m, memory: 160Mi }
    limits: { memory: 384Mi }

# Alerts are visible on Prometheus's Alerts page; no Alertmanager routing is needed
# for the demo, so leave it out and save the memory.
alertmanager:
  enabled: false

# minikube does not expose these control-plane components' metrics, so their targets
# would only ever show as down.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 96Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 20m, memory: 64Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 20m, memory: 32Mi }
