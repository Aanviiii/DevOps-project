# Local minikube environment, managed by Argo CD (k8s/argocd/application.yaml).
#
# image.tag below is only the starting point. Argo CD Image Updater overrides it with
# the newest sha-xxxxxxx image CI pushed to GHCR (as a parameter on the Application),
# so a merged commit rolls out without any commit back to this repository.

image:
  tag: sha-914a82e # starting point; Image Updater moves it to each new build

backend:
  seedDemoData: true

postgres:
  # Throwaway local database. Real environments use postgres.existingSecret.
  password: shelfwise-local-only

ingress:
  className: nginx
  host: shelfwise.local

networkPolicy:
  enabled: true
