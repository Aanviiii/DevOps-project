{{- if .Values.activity.enabled }}
# Simulated patrons: one small pod calling the API like a busy library desk, so the
# metrics and dashboards always have live traffic to show.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shelfwise.fullname" . }}-activity
  labels:
    {{- include "shelfwise.baseLabels" . | nindent 4 }}
    {{- include "shelfwise.selector" (list . "activity") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "shelfwise.selector" (list . "activity") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shelfwise.baseLabels" . | nindent 8 }}
        {{- include "shelfwise.selector" (list . "activity") | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 10002
      containers:
        - name: activity
          image: {{ include "shelfwise.image" (list . "activity") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SHELFWISE_API_URL
              value: {{ printf "http://%s:%v" (include "shelfwise.backendService" .) .Values.backend.port | quote }}
            - name: ACTIONS_PER_MINUTE
              value: {{ .Values.activity.actionsPerMinute | quote }}
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
{{- end }}
