{{- /* A HorizontalPodAutoscaler and a PodDisruptionBudget for each web tier. */ -}}
{{- range $component := list "backend" "frontend" }}
{{- $cfg := index $.Values $component }}
{{- if $cfg.autoscaling.enabled }}
---
# Scales on CPU, measured against the pods' CPU *requests*, so the requests in
# values.yaml define what "60% busy" means. Needs metrics-server in the cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ printf "%s-%s" (include "shelfwise.fullname" $) $component }}
  labels:
    {{- include "shelfwise.baseLabels" $ | nindent 4 }}
    {{- include "shelfwise.selector" (list $ $component) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ printf "%s-%s" (include "shelfwise.fullname" $) $component }}
  minReplicas: {{ $cfg.autoscaling.minReplicas }}
  maxReplicas: {{ $cfg.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $cfg.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    # React to load quickly, but wait a minute of calm before removing pods so a
    # bursty load does not make the replica count flap.
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
{{- end }}
{{- with $cfg.podDisruptionBudget }}
---
# Voluntary disruptions (node drains, cluster upgrades) must leave this many running.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ printf "%s-%s" (include "shelfwise.fullname" $) $component }}
  labels:
    {{- include "shelfwise.labels" $ | nindent 4 }}
spec:
  minAvailable: {{ .minAvailable }}
  selector:
    matchLabels:
      {{- include "shelfwise.selector" (list $ $component) | nindent 6 }}
{{- end }}
{{- end }}
