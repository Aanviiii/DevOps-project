{{- if not .Values.postgres.existingSecret }}
{{- $password := required "postgres.password is required when postgres.existingSecret is not set" .Values.postgres.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shelfwise.dbSecret" . }}
  labels:
    {{- include "shelfwise.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ $password | quote }}
  # The backend reads one connection URL; it is built here so the password lives in
  # a Secret rather than in plain Deployment env.
  database-url: {{ printf "postgresql+psycopg://%s:%s@%s:5432/%s" .Values.postgres.username $password (include "shelfwise.postgresHost" .) .Values.postgres.database | quote }}
{{- end }}
