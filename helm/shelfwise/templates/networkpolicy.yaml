{{- if .Values.networkPolicy.enabled }}
# Least-privilege traffic between the tiers. Policies only take effect where the
# cluster's network plugin enforces them (Calico, Cilium, or EKS VPC CNI with network
# policy turned on); elsewhere they are accepted but ignored.
#
#   ingress controller -> frontend, backend
#   frontend -> backend
#   monitoring -> backend (/metrics)
#   backend -> postgres          (and nothing else reaches postgres)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shelfwise.fullname" . }}-postgres
  labels:
    {{- include "shelfwise.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "shelfwise.selector" (list . "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "shelfwise.selector" (list . "backend") | nindent 14 }}
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shelfwise.fullname" . }}-backend
  labels:
    {{- include "shelfwise.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "shelfwise.selector" (list . "backend") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      ports:
        - port: {{ .Values.backend.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shelfwise.fullname" . }}-frontend
  labels:
    {{- include "shelfwise.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "shelfwise.selector" (list . "frontend") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
      ports:
        - port: {{ .Values.frontend.port }}
{{- end }}
