apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shelfwise.frontendService" . }}
  labels:
    {{- include "shelfwise.baseLabels" . | nindent 4 }}
    {{- include "shelfwise.selector" (list . "frontend") | nindent 4 }}
spec:
  {{- if not .Values.frontend.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "shelfwise.selector" (list . "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shelfwise.baseLabels" . | nindent 8 }}
        {{- include "shelfwise.selector" (list . "frontend") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 101
        runAsGroup: 101
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "shelfwise.selector" (list . "frontend") | nindent 14 }}
      containers:
        - name: frontend
          image: {{ include "shelfwise.image" (list . "frontend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          env:
            # nginx forwards /api/ to the backend Service inside the cluster.
            - name: SHELFWISE_API_UPSTREAM
              value: {{ printf "http://%s:%v" (include "shelfwise.backendService" .) .Values.backend.port | quote }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          # The root filesystem is read-only; nginx writes its rendered config, pid file
          # and temp files to these in-memory volumes.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shelfwise.frontendService" . }}
  labels:
    {{- include "shelfwise.baseLabels" . | nindent 4 }}
    {{- include "shelfwise.selector" (list . "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "shelfwise.selector" (list . "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
