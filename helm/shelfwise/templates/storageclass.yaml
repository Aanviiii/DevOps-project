{{- if .Values.storageClass.create }}
# EKS clusters have no default StorageClass, so the chart brings one for the Postgres
# volume: encrypted gp3, created only when a pod actually needs it, and kept (not
# deleted) if the claim is removed by mistake.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClass.name }}
  labels:
    {{- include "shelfwise.labels" . | nindent 4 }}
provisioner: {{ .Values.storageClass.provisioner }}
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
{{- end }}
